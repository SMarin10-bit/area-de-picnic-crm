<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Área de Picnic · CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#80AA8D;--dark:#2D3E46;--light:#EFF2EE;--bg:#F7F9F7;
  --ok:#4bb98c;--warn:#dc8f38;--err:#dd7774;--info:#71b5dc;
  --fg:#333333;--mut:#889394;--card:#FFFFFF;--line:#E3E9E3;
  --r:10px;--pad:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
h1{font-family:Georgia,serif}
.hidden{display:none!important}
#login-view{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2D3E46 0%,#41565f 55%,#80AA8D 120%);padding:20px}
.login-card{background:#fff;width:380px;max-width:100%;border-radius:16px;padding:32px 28px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.login-card .logo{width:64px;height:64px;border-radius:14px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;margin:0 auto 14px}
.login-card h1{font-size:22px;text-align:center;font-weight:700;color:var(--dark)}
.login-card p.sub{text-align:center;color:var(--mut);font-size:13px;margin:6px 0 20px}
.hint-seed{background:var(--light);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--mut);margin-bottom:16px;line-height:1.5}
.hint-seed b{color:var(--dark)}
#login-msg{color:var(--err);font-size:12px;min-height:16px;margin-top:10px;text-align:center}
#login-view button.submit,#modal button.submit{width:100%;background:var(--dark);color:#fff;border:0;border-radius:9px;padding:11px;font-size:14px;font-weight:600;margin-top:8px}
#login-view button.submit:hover,#modal button.submit:hover{background:#22333a}
#app-view{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.menu{background:var(--dark);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.menu .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.menu .brand .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.menu .brand b{font-size:14px;display:block;line-height:1.2}
.menu .brand span{font-size:11px;color:#9fb3af}
.menu button.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#cfdcd8;padding:10px 12px;border-radius:9px;text-align:left;font-size:13.5px}
.menu button.nav:hover{background:rgba(255,255,255,.08)}
.menu button.nav.on{background:var(--accent);color:#12201c;font-weight:600}
.menu .pin{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:12px;font-size:11.5px;color:#9fb3af;line-height:1.6}
.sync-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:20px;padding:4px 10px;margin-top:6px;font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.warn{background:var(--warn)}
.dot.err{background:var(--err)}
.main{padding:26px 30px;max-width:1200px;width:100%;margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.head h2{font-size:21px;font-weight:700;color:var(--dark)}
.head .meta{color:var(--mut);font-size:12px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .t{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:700;color:var(--dark);margin-top:6px}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 320px;gap:18px}
.donut-wrap{display:flex;flex-direction:column;gap:10px;align-items:center}
.donut{width:150px;height:150px;border-radius:50%;position:relative}
.donut:after{content:'';position:absolute;inset:22px;background:#fff;border-radius:50%}
.legend{width:100%;font-size:12px}
.legend div{display:flex;justify-content:space-between;padding:4px 2px;border-bottom:1px dashed var(--line)}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#FAFCFA}
.thumb{width:38px;height:50px;object-fit:cover;border-radius:6px;background:var(--light)}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-verde{background:#E2F3EA;color:#1F7A56}
.b-amarillo{background:#FBF0DC;color:#9A5B0A}
.b-rojo{background:#FBE5E3;color:#B02A24}
.b-gris{background:#EDF0EF;color:#5c6b67}
.b-azul{background:#E3EFF8;color:#2C6B9A}
.b-auto{background:#E9EDFB;color:#3D51B5}
.demo-tag{background:#fff3d6;color:#8a6d1f;border:1px dashed #d9b64e;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:600}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--dark);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--dark)}
.btn.pri{background:var(--accent);color:#12201c;border-color:var(--accent)}
.btn.pri:hover{background:#6e9a7c}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.danger{color:#B02A24;border-color:#E8C8C5}
.btn.sm{padding:5px 9px;font-size:11.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto;min-width:170px}
.toolbar .sp{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.rowc{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.mut{color:var(--mut)}.xs{font-size:11.5px}.sm{font-size:12.5px}
#toast-wrap{position:fixed;bottom:18px;right:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--dark);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:340px}
.toast.ok{background:#245c44}.toast.err{background:#8c3a34}
#modal-bg{position:fixed;inset:0;background:rgba(20,30,33,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
#modal{background:#fff;border-radius:14px;width:520px;max-width:100%;max-height:90vh;overflow:auto;padding:24px}
#modal h3{margin-bottom:16px;color:var(--dark)}
#modal label,.card>label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
#modal .act{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.log-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.log-item .t{color:var(--mut);min-width:118px}
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:10px}
.chart-bars .bar{flex:1;background:linear-gradient(180deg,var(--accent),#5b8370);border-radius:5px 5px 0 0;min-width:14px;position:relative}
.chart-bars .bar span{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--mut);margin-bottom:3px}
.chart-bars .xlab{position:relative;color:var(--mut);font-size:10.5px;text-align:center;padding-top:5px}
/* Rótulo "Sin Stock" (Instrument Sans 11px, #e13030) debajo del precio */
.sin-stock{display:block;margin-top:2px;font-family:'Instrument Sans','Segoe UI',Arial,sans-serif;font-size:11px;line-height:1.3;font-weight:600;letter-spacing:.2px;color:#e13030}
/* Temáticas del catálogo */
.b-viajes{background:#E3EFF8;color:#2C6B9A}
.b-familia{background:#FBF0DC;color:#9A5B0A}
.b-cocina{background:#E2F3EA;color:#1F7A56}
.b-sin{background:#EDF0EF;color:#5c6b67}
tr.tema-row td{background:var(--light);color:var(--dark);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--line)}
tr.tema-row:hover td{background:var(--light)}
tr.tema-row td .xs{font-weight:500;text-transform:none;letter-spacing:0;margin-left:10px;color:var(--mut)}
.themes-check{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
#modal .themes-check label{display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:500;color:var(--fg);font-size:13px}
.themes-check input{width:auto}
/* Preferencias e historial de clientes */
.pref-bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.pref-bar .lab{width:96px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pref-bar .trk{flex:1;background:var(--light);border-radius:6px;height:10px;overflow:hidden}
.pref-bar .fil{height:10px;border-radius:6px}
.pref-bar .pct{width:86px;text-align:right;color:var(--mut);font-size:11.5px;white-space:nowrap}
.hist-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;align-items:flex-start;flex-wrap:wrap}
.hist-item .d{color:var(--mut);min-width:78px}
.hist-item .n{min-width:64px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-block;padding:3px 9px;border-radius:14px;font-size:11.5px;background:var(--light);color:var(--dark);border:1px solid var(--line)}
.chip.sug{background:#fff;border-style:dashed}
#modal.wide{width:720px}
@media(max-width:860px){
  #app-view{grid-template-columns:1fr}
  .menu{flex-direction:row;flex-wrap:wrap;height:auto;position:static;gap:6px}
  .menu .brand{padding-bottom:4px}
  .menu .pin{margin-top:0;border:0;padding:4px 8px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <div class="logo">AP</div>
    <h1>Área de Picnic · CRM</h1>
    <p class="sub">Gestión comercial conectada a la tienda online</p>

    <div id="login-msg"></div>
    <button class="submit" onclick="doLogin()">Ingresar</button>
  </div>
</div>

<div id="app-view" class="hidden">
  <aside class="menu">
    <div class="brand"><div class="logo">AP</div><div><b>Área de Picnic</b><span>CRM · Prototipo</span></div></div>
    <button class="nav on" onclick="go('dash')">▦ Dashboard</button>

    <button class="nav" onclick="go('ord')">🧾 Pedidos</button>

      <div class="xs" style="margin-top:8px" id="menu-user"></div>

  </aside>
  <main class="main" id="main"></main>
</div>

<div id="modal-bg" class="hidden" onclick="if(event.target===this)closeModal()">
  <div id="modal"></div>
</div>
<div id="toast-wrap"></div>

<script>

const STORE="tiendadeareadepicnic.mitiendanube.com";
const STORE_NAME="Área de Picnic";

familia:["hay-equipo-a-cocinar","antonia-y-el-luno","no-te-olvides-antonia","la-semana-de-antonia"],
cocina:["la-biblia-y-el-bodegon-1k058","huevo-tito-en-el-bodegon-hyd7i","hay-equipo-a-cocinar"]
};
// Respaldo por nombre (sin acentos ni signos) por si la tienda cambia el slug de un producto.
const THEME_NAMES={
viajes:["el pais en tero aventura en jujuy","el pais en tero aventura en el litoral","el pais en tero aventura en puerto madryn"],
familia:["hay equipo a cocinar","antonia y el luno","no te olvides antonia","la semana de antonia"],
cocina:["la biblia y el bodegon","huevo tito en el bodegon","hay equipo a cocinar"]
};

const SNAPSHOT=[
{slug:"el-pais-en-tero-aventura-en-jujuy",name:"El País en Tero – Aventura en Jujuy",price:30000,currency:"ARS",stock:272,availability:"InStock",image:"https://acdn-us.mitiendanube.com/stores/007/631/689/products/whatsapp-image-2026-08-02-at-16-53-03-d4d0f2ee13202dda6e17857011151719-480-0.webp",description:"Compra online El País en Tero – Aventura en Jujuy. Libro ilustrado de viaje por el norte argentino.",weight:0.35},
{slug:"el-pais-en-tero-aventura-en-el-litoral-2da-edicion",name:"El país en Tero - Aventura en el Litoral (2da edición)",price:30000,currency:"ARS",stock:199,availability:"InStock",image:"https://acdn-us.mitiendanube.com/stores/007/631/689/products/img_8841-1-3834b51e7932c19fd117774701368005-480-0.webp",description:"Compra online El país en Tero - Aventura en el Litoral (2da edición).",weight:0.3},
{slug:"el-pais-en-tero-aventura-en-puerto-madryn",name:"El país en Tero - Aventura en Puerto Madryn",price:30000,currency:"ARS",stock:99,availability:"InStock",image:"https://acdn-us.mitiendanube.com/stores/007/631/689/products/img_2689-82cd64b37d70e0045017774663536542-480-0.webp",description:"Compra online El país en Tero - Aventura en Puerto Madryn.",weight:0.3},
{slug:"atrapaviajes",name:"Atrapaviajes",price:28000,currency:"ARS",stock:299,availability:"InStock",image:"https://acdn-us.mitiendanube.com/stores/007/631/689/products/img_8661-1-1ae1f90e2d0ec7135317781860824281-480-0.webp",description:"Un libro interactivo para chicos y familias viajeras. Atrapaviajes combina juegos, actividades, recuerdos y creatividad para transformar cada viaje en una experiencia inolvidable.",weight:0.5},
{slug:"el-barrio-en-tero",name:"El barrio en Tero",price:14000,currency:"ARS",stock:599,availability:"InStock",image:"https://acdn-us.mitiendanube.com/stores/007/631/689/products/img_8827-2-46c13fbfcf27d21e4b17774834181399-480-0.webp",description:"Compra online El barrio en Tero.",weight:0.1},
{slug:"huevo-tito-en-el-bodegon-hyd7i",name:"Huevo Tito en el bodegón",price:20000,currency:"ARS",stock:1500,availability:"InStock",image:"https://acdn-us.mitiendanube.com/stores/007/631/689/products/huevo-tito-frente-3fb1fbbed131cadfcf17816511169295-480-0.webp",description:"Compra online Huevo Tito en el bodegón.",weight:0.18},
{slug:"no-te-olvides-antonia",name:"¡No te olvides Antonia!",price:27000,currency:"ARS",stock:200,availability:"InStock",image:"https://acdn-us.mitiendanube.com/stores/007/631/689/products/no-te-olvides-1-46544d60c6b7bfbd1917781720555559-480-0.webp",description:"Un cuento ilustrado para acompañar emociones, memoria y vínculos familiares. Ideal para niños de 3 a 7 años.",weight:0.3},
{slug:"antonia-y-el-luno",name:"Antonia y el Luno",price:27000,currency:"ARS",stock:400,availability:"InStock",image:"https://acdn-us.mitiendanube.com/stores/007/631/689/products/img_4504tn-jpg-189456870da9ce2d5417779062069321-480-0.webp",description:"Compra online Antonia y el Luno.",weight:0.3},

{slug:"la-semana-de-antonia",name:"La semana de Antonia",price:27000,currency:"ARS",stock:30,availability:"InStock",image:"https://acdn-us.mitiendanube.com/stores/007/631/689/products/semana-1-1487c1bd84eb1fb4af17781842381033-480-0.webp",description:"Compra online La semana de Antonia.",weight:0.3}
];

// Proxies CORS públicos para la lectura en vivo (intento secundario; suelen caerse).
const PROXIES=[
{name:"allorigins",build:u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u)},
{name:"corsproxy.io",build:u=>"https://corsproxy.io/?url="+encodeURIComponent(u)},
{name:"codetabs",build:u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u)}
];

let db=null, view="dash", timer=null, busy=false, liveBusy=false;

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmt(n){return "$ "+Number(n||0).toLocaleString("es-AR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtD(d){const t=new Date(d);return t.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"})}
function ago(d){const s=(Date.now()-new Date(d).getTime())/1000;if(s<60)return "hace "+Math.round(s)+" seg";if(s<3600)return "hace "+Math.round(s/60)+" min";if(s<86400)return "hace "+Math.round(s/3600)+" h";return "hace "+Math.round(s/86400)+" d"}
function daysAgo(n){return new Date(Date.now()-n*864e5).toISOString()}
function uid(p){return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmtDT(d){const t=new Date(d);return isNaN(t.getTime())?"":t.toLocaleString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}
// Marcas diacríticas (U+0300–U+036F) que deja normalize("NFD"); se construye sin escapes para evitar ambigüedades.
const DIACRITICS=new RegExp("["+String.fromCharCode(768)+"-"+String.fromCharCode(879)+"]","g");
function norm(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(DIACRITICS,"").replace(/[^a-z0-9]+/g," ").trim()}
// Tienda Nube agrega sufijos de 5 caracteres con dígitos a algunos slugs (ej. "-1k058").
function baseSlug(s){s=String(s||"");const m=s.match(/-([a-z0-9]{5})$/);return m&&/\d/.test(m[1])?s.slice(0,-6):s}
function themesFor(slug,name){
  const n=norm(name),b=baseSlug(slug);
  return THEMES.filter(t=>(THEME_BOOKS[t.key]||[]).some(s=>s===slug||baseSlug(s)===b)||(THEME_NAMES[t.key]||[]).some(k=>n===k||n.startsWith(k+" "))).map(t=>t.key);
}
const themeOf=k=>THEMES.find(t=>t.key===k);
function themeLabels(p){return (p.themes||[]).map(k=>{const t=themeOf(k);return t?t.label:k}).join(" ")}
function themeBadges(p){const th=(p.themes||[]).filter(k=>themeOf(k));return th.length?th.map(k=>{const t=themeOf(k);return '<span class="badge b-'+k+'">'+t.icon+' '+esc(t.label)+'</span>'}).join(" "):'<span class="badge b-sin">Sin temática</span>'}
function isOut(p){return p.stock===0||p.availability==="OutOfStock"}
function fullName(c){if(!c)return "—";const f=((c.firstName||"")+" "+(c.lastName||"")).trim();return f||c.name||"—"}
function emailKey(e){return String(e==null?"":e).trim().toLowerCase()}
function findByEmail(e,exceptId){e=emailKey(e);return e?db.customers.find(c=>c.id!==exceptId&&emailKey(c.email)===e):null}
function splitName(full){const parts=String(full||"").trim().split(/\s+/).filter(Boolean);if(parts.length<=1)return {firstName:parts[0]||"",lastName:""};return {firstName:parts.slice(0,-1).join(" "),lastName:parts[parts.length-1]}}

async function sha256(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("apex|"+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return "f_"+h.toString(16)}}

// Actualiza bases guardadas por versiones anteriores de la CRM sin perder datos:
// temáticas en productos, nombre/apellido separados en clientes, email normalizado, config nueva.
function migrateDb(d){
  let changed=false;
  if(!d.meta){d.meta={createdAt:Date.now()};changed=true}
  if(!d.config){d.config={tnToken:"",tnUrl:TN_API,syncInterval:60};changed=true}
  if(!d.config.mode||d.config.mode==="proxy"){d.config.mode="auto";changed=true}
  if(d.config.snapshotUrl==null){d.config.snapshotUrl=REPO_RAW+SNAPSHOT_FILE;changed=true}
  if(!Array.isArray(d.syncLog)){d.syncLog=[];changed=true}
  (d.products||[]).forEach(p=>{if(!Array.isArray(p.themes)){p.themes=themesFor(p.slug,p.name);changed=true}});
  (d.customers||[]).forEach(c=>{
    if(c.firstName==null||c.lastName==null){const s=splitName(c.name);c.firstName=s.firstName;c.lastName=s.lastName;changed=true}
    const e=emailKey(c.email);if((c.email||"")!==e){c.email=e;changed=true}
    const full=fullName(c);if(c.name!==full){c.name=full;changed=true}
  });
  if(d.meta.version!==DB_VERSION){d.meta.version=DB_VERSION;changed=true}
  return changed;
}

function fetchWithTimeout(url,ms,opts){
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),ms);
  return fetch(url,Object.assign({signal:ctrl.signal,cache:"no-store"},opts||{})).finally(()=>clearTimeout(t));
}
function bust(u){return u+(u.includes("?")?"&":"?")+"t="+Date.now()}

// Fuentes del snapshot: primero el repositorio (raw.githubusercontent.com permite CORS y sirve
// siempre el último commit), luego el mismo sitio (GitHub Pages / servidor estático).
function snapshotSources(){
  const out=[];
  const cfg=(db.config.snapshotUrl||"").trim();
  if(cfg)out.push({name:"snapshot GitHub",url:cfg});
  if(/^https?:$/.test(location.protocol)){
    const local=new URL(SNAPSHOT_FILE,location.href).href;
    if(local!==cfg)out.push({name:"snapshot del sitio",url:local});
  }
  return out;
}

// Acepta el formato nuevo {updatedAt, products:[...]} y el viejo (array plano).
function normalizeSnapshot(j){
  const list=Array.isArray(j)?j:(j&&Array.isArray(j.products)?j.products:[]);
  const items=list.map(p=>({slug:String(p.slug||""),name:String(p.name||""),price:Number(p.price),currency:p.currency||"ARS",stock:(p.stock==null||p.stock==="")?null:parseInt(p.stock,10),availability:String(p.availability||"").split("/").pop()==="OutOfStock"?"OutOfStock":"InStock",image:p.image||"",description:String(p.description||"").slice(0,400),weight:(p.weight==null||p.weight==="")?null:Number(p.weight)})).filter(p=>p.slug&&p.name&&!isNaN(p.price));
  items.forEach(p=>{if(p.stock!=null&&p.stock<=0)p.availability="OutOfStock"});
  return {items,updatedAt:(!Array.isArray(j)&&j&&j.updatedAt)?j.updatedAt:null};
}

async function fetchSnapshot(){
  let lastErr=null;
  for(const s of snapshotSources()){
    try{
      const r=await fetchWithTimeout(bust(s.url),12000);
      if(!r.ok)throw new Error("HTTP "+r.status);
      const {items,updatedAt}=normalizeSnapshot(await r.json());
      if(!items.length)throw new Error("snapshot vacío");
      return {items,updatedAt,source:s.name,live:false};
    }catch(e){lastErr=new Error(s.name+": "+(e.name==="AbortError"?"tiempo de espera agotado":(e.message||e)))}
  }
  throw lastErr||new Error("sin fuente de snapshot configurada");
}

// Lectura en vivo de la página pública de la tienda (JSON-LD). Los navegadores bloquean la
// llamada directa por CORS; por eso se intenta a través de proxies públicos (pueden estar caídos).
async function fetchLive(){
  const chain=(db.config.mode||"auto")==="directo"?[{name:"directo",build:u=>u}]:PROXIES;
  let lastErr=null;
  for(const p of chain){
    try{
      const r=await fetchWithTimeout(p.build(CATALOG_URL),10000);
      if(!r.ok)throw new Error("HTTP "+r.status);
      const text=await r.text();
      if(!text||!text.includes("structured-data.item"))throw new Error("respuesta sin catálogo");
      const items=parseCatalog(text);
      if(!items.length)throw new Error("sin productos");
      return {items,updatedAt:new Date().toISOString(),source:"en vivo · "+p.name,live:true};
    }catch(e){lastErr=new Error(p.name+": "+(e.name==="AbortError"?"tiempo de espera agotado":(e.message||e)))}
  }
  throw lastErr||new Error("sin acceso en vivo");
}

function parseCatalog(html){
  const out=[];
  const blocks=html.match(/structured-data\.item[\s\S]*?<\/script>/g)||[];
  for(const b of blocks){
    const start=b.indexOf("{");
    if(start<0)continue;
    try{
      const j=JSON.parse(b.slice(start).replace(/<\/script>$/,""));
      if(!j||j["@type"]!=="Product"||!j.offers||!j.name)continue;
      const id=(j.mainEntityOfPage&&j.mainEntityOfPage["@id"])||"";
      const m=id.match(/productos\/([a-z0-9\-]+)\//);
      const inv=j.offers.inventoryLevel?j.offers.inventoryLevel.value:null;
      const stock=(inv!=null&&inv!=="")?parseInt(inv,10):null;
      const image=Array.isArray(j.image)?j.image[0]:j.image;
      out.push({slug:m?m[1]:"p_"+Math.random().toString(36).slice(2,7),name:j.name,price:parseFloat(j.offers.price),currency:j.offers.priceCurrency||"ARS",stock,availability:((j.offers.availability||"").split("/").pop()==="OutOfStock"||(stock!=null&&stock<=0))?"OutOfStock":"InStock",image:image||"",description:(j.description||"").slice(0,400),weight:(j.weight&&j.weight.value!=null)?Number(j.weight.value):null});
    }catch(e){}
  }
  return out;
}

function applyCatalog(items){
  let added=0,updated=0;const bySlug={};db.products.forEach(p=>bySlug[p.slug]=p);
  for(const it of items){
    const ex=bySlug[it.slug];
    if(ex){
      ex.price=it.price;ex.stock=it.stock;ex.availability=it.availability;ex.currency=it.currency||ex.currency;
      ex.image=it.image||ex.image;ex.description=it.description||ex.description;if(it.weight!=null)ex.weight=it.weight;
      if(it.name&&ex.name!==it.name)ex.name=it.name;
      if(!Array.isArray(ex.themes))ex.themes=themesFor(ex.slug,ex.name);
      ex.fresh=true;updated++;
    }else{
      db.products.push({id:"p_"+it.slug,slug:it.slug,name:it.name,price:it.price,stock:it.stock,availability:it.availability,image:it.image,description:it.description,currency:it.currency,weight:it.weight,crmPrice:null,status:"activo",category:"Importado en vivo",themes:themesFor(it.slug,it.name),note:""});
      added++;
    }
  }
  return {added,updated};
}

function logSync(ok,source,added,updated,message){db.syncLog.unshift({ts:Date.now(),ok,source,added,updated,message});db.syncLog=db.syncLog.slice(0,60)}

function commitSync(res){
  const {added,updated}=applyCatalog(res.items);
  db.lastSync=Date.now();db.lastSource=res.source;
  if(res.updatedAt)db.catalogUpdatedAt=res.updatedAt;
  if(res.live)db.liveStatus={ok:true,ts:Date.now(),msg:res.source};
  logSync(true,res.source,added,updated,(res.live?"Catálogo leído en vivo desde la tienda":"Catálogo sincronizado desde el snapshot del repositorio (GitHub Actions)")+(res.updatedAt?" · datos de la tienda al "+fmtDT(res.updatedAt):"")+" · "+res.items.length+" productos");
  save();
  setPill("on",(res.live?"En línea · ":"Sincronizado · ")+res.source.replace(/^en vivo · /,""));
  return {added,updated};
}

// Sincronización: en modo auto/snapshot lee el snapshot del repositorio (rápido, sin CORS) y,
// en modo auto, intenta además la lectura en vivo en segundo plano sin bloquear la interfaz.
async function syncNow(manual,quiet){
  if(busy)return;busy=true;
  setPill("warn","Sincronizando…");
  const mode=db.config.mode||"auto";
  try{
    const res=mode==="directo"?await fetchLive():await fetchSnapshot();
    const {added,updated}=commitSync(res);
    if(!quiet)toast("Sincronizado ("+res.source+"): "+added+" nuevo(s), "+updated+" actualizado(s)"+(res.updatedAt&&!res.live?" · catálogo al "+fmtDT(res.updatedAt):"")+".","ok");
    if(manual)render();
    if(mode==="auto")tryLive(quiet);
  }catch(e){
    db.lastSource="caché";
    logSync(false,"caché",0,0,"Falla de conexión: "+(e.message||"desconocido")+" · se trabaja con caché local");
    save();
    setPill("err","Caché local");
    if(!quiet)toast("No se pudo sincronizar ("+(e.message||"")+"). Operando con datos cacheados.","err");
    if(manual)render();
  }finally{busy=false;paintLastSync()}
}

async function tryLive(quiet){
  if(liveBusy)return;liveBusy=true;
  try{
    const res=await fetchLive();
    commitSync(res);
    if(view==="dash"||view==="prod")render();
    if(!quiet)toast("Catálogo en vivo actualizado ("+res.source+").","ok");
  }catch(e){
    db.liveStatus={ok:false,ts:Date.now(),msg:e.message||"sin acceso"};save();
  }finally{liveBusy=false;paintLastSync()}
}

// Análisis del historial de compras de un cliente: temáticas preferidas, títulos y sugerencias.
function prefsOf(c){
  const orders=db.orders.filter(o=>o.customerId===c.id);
  const valid=orders.filter(o=>o.status!=="cancelado");
  const themeU={},titles={},chan={},bought=new Set();let units=0,spent=0;
  valid.forEach(o=>{
    spent+=totalOf(o);const ch=o.channel||"—";chan[ch]=(chan[ch]||0)+1;
    (o.items||[]).forEach(i=>{
      const q=Number(i.qty)||1;units+=q;titles[i.name]=(titles[i.name]||0)+q;
      const p=productByName(i.name);
      const th=p&&p.themes&&p.themes.length?p.themes:["sin"];
      if(p)bought.add(p.slug);
      th.forEach(k=>themeU[k]=(themeU[k]||0)+q);
    });
  });
  const tot=Object.values(themeU).reduce((a,b)=>a+b,0);
  const themes=Object.entries(themeU).map(([k,u])=>{const t=themeOf(k);return {key:k,label:t?t.label:"Sin temática",icon:t?t.icon:"📦",color:t?t.color:"#b9c2c0",units:u,pct:tot?Math.round(u/tot*100):0}}).sort((a,b)=>b.units-a.units);
  const top=Object.entries(titles).map(([name,u])=>({name,units:u})).sort((a,b)=>b.units-a.units);
  const fav=themes.find(t=>t.key!=="sin")||null;
  const suggestions=fav?db.products.filter(p=>p.status==="activo"&&(p.themes||[]).includes(fav.key)&&!bought.has(p.slug)).slice(0,3):[];
  const last=valid.map(o=>o.date).sort().pop()||null;
  const favChannel=Object.entries(chan).sort((a,b)=>b[1]-a[1])[0];
  return {orders:orders.length,valid:valid.length,units,spent,themes,top,fav,suggestions,last,channel:favChannel?favChannel[0]:null,ticket:valid.length?spent/valid.length:0};
}

  const t0=pr.top[0];
  return th+'<div class="xs mut" style="margin-top:3px">Más comprado: '+esc(t0.name)+(t0.units>1?" ×"+t0.units:"")+'</div>';
}

function themeSales(){
  const u={};
  db.orders.filter(o=>o.status!=="cancelado").forEach(o=>(o.items||[]).forEach(i=>{const p=productByName(i.name);const th=p&&p.themes&&p.themes.length?p.themes:["sin"];th.forEach(k=>u[k]=(u[k]||0)+(Number(i.qty)||1))}));
  const tot=Object.values(u).reduce((a,b)=>a+b,0);
  return [...THEMES.map(t=>({key:t.key,label:t.label,icon:t.icon,color:t.color,units:u[t.key]||0})),{key:"sin",label:"Sin temática",icon:"📦",color:"#b9c2c0",units:u.sin||0}].map(t=>Object.assign(t,{pct:tot?Math.round(t.units/tot*100):0}));
}

function seg(c){
  const spent=db.orders.filter(o=>o.customerId===c.id&&o.status!=="cancelado").reduce((a,o)=>a+totalOf(o),0);
  const n=db.orders.filter(o=>o.customerId===c.id).length;
  if(spent>=90000)return "VIP";if(n>=2)return "Frecuente";if(n>=1)return "Activo";return "Nuevo";
}

function channelColors(){
  const ch={};
  db.orders.forEach(o=>{if(o.status!=="cancelado")ch[o.channel]=(ch[o.channel]||0)+totalOf(o)});
  const cols=["#80AA8D","#2D3E46","#71b5dc","#dc8f38","#dd7774"];
  return Object.entries(ch).map(([k,v],i)=>({k,v,c:cols[i%cols.length]}));
}
function weekSeries(){
  const w=[...Array(8)].map((_,i)=>({label:"S"+(-7+i),sum:0}));
  const names={"S-7":"hace 7 sem",0:"esta sem"};
  const base=new Date();base.setHours(0,0,0,0);
  db.orders.forEach(o=>{
    if(o.status==="cancelado")return;
    const d=new Date(o.date);
    const diff=Math.floor((base.getTime()-d.getTime())/6048e5);
    if(diff<0||diff>7)return;
    const idx=7-diff;
    w[idx].sum+=totalOf(o);w[idx].label=diff===0?"esta sem":"S-"+diff;
  });
  return w;
}

function render(){
  const m=document.getElementById("main");
  paintLastSync();
  if(view==="dash")m.innerHTML=dashHTML();
  else if(view==="prod")m.innerHTML=prodHTML();
  else if(view==="ord")m.innerHTML=ordHTML();
  else if(view==="cli")m.innerHTML=cliHTML();
  else m.innerHTML=setHTML();
}

function kpi(t,v,s){return `<div class="kpi"><div class="t">${t}</div><div class="v">${v}</div><div class="s">${s||""}</div></div>`}

function dayLabel(l){return l==="esta sem"?"esta sem":(l.startsWith("S-")?l.split("-")[1]+" sem":l)}

function prodRow(p){
  const out=isOut(p);
  const bad=out?'<span class="badge b-rojo">Sin stock · 0</span>':p.stock==null?"—":p.stock<10?'<span class="badge b-rojo">Crítico · '+p.stock+'</span>':p.stock<50?'<span class="badge b-amarillo">Bajo · '+p.stock+'</span>':'<span class="badge b-verde">OK · '+p.stock+'</span>';
  const st=p.status==="activo"?'<span class="badge b-verde">Activo</span>':p.status==="oculto"?'<span class="badge b-gris">Oculto</span>':'<span class="badge b-rojo">Retirado</span>';
  return `<tr>
      <td><img class="thumb" src="${esc(p.image)}" onerror="this.style.opacity=.25"></td>
      <td><b>${esc(p.name)}</b><div class="xs mut">${esc(p.slug)} ${p.crmPrice!=null?'<span class="badge b-azul">precio CRM</span>':""}</div></td>
      <td>${themeBadges(p)}</td>
      <td><div>${fmt(p.price)}</div>${out?'<span class="sin-stock">Sin Stock</span>':""}${p.crmPrice!=null&&p.crmPrice!==p.price?'<div class="xs mut">CRM: '+fmt(p.crmPrice)+'</div>':""}</td>
      <td>${bad}</td>
      <td>${st}</td>
      <td><button class="btn sm" onclick="editProd('${p.id}')">Editar</button></td>
    </tr>`;
}

  if(q)list=list.filter(p=>(p.name+" "+p.slug+" "+(p.category||"")+" "+themeLabels(p)).toLowerCase().includes(q.toLowerCase()));
  if(fst!=="all")list=list.filter(p=>fst==="bajo"?(p.stock!=null&&p.stock<50):fst==="sin"?isOut(p):fst==="oculto"?p.status!=="activo":true);
  const pos=(order,s)=>{const i=order.findIndex(o=>o===s||baseSlug(o)===baseSlug(s));return i<0?99:i};
  const groups=[];
  THEMES.forEach(t=>{
    if(ft!=="all"&&ft!==t.key)return;
    const order=THEME_BOOKS[t.key]||[];
    groups.push({t,items:list.filter(p=>(p.themes||[]).includes(t.key)).sort((a,b)=>pos(order,a.slug)-pos(order,b.slug)||a.name.localeCompare(b.name))});
  });
  if(ft==="all"||ft==="sin")groups.push({t:{key:"sin",label:"Sin temática asignada",icon:"📦"},items:list.filter(p=>!(p.themes||[]).some(k=>themeOf(k))).sort((a,b)=>a.name.localeCompare(b.name))});

function saveProd(id){
  const p=db.products.find(x=>x.id===id);
  p.crmPrice=document.getElementById("mp-crm").value?Number(document.getElementById("mp-crm").value):null;
  p.status=document.getElementById("mp-st").value;
  p.note=document.getElementById("mp-note").value.trim();
  p.themes=[...document.querySelectorAll(".mp-tema:checked")].map(x=>x.value);p.themesManual=true;
  save();closeModal();render();toast("Producto actualizado.","ok");
}

}

async function syncOrders(){
  const btn=document.getElementById("tn-sync-btn");
  try{
    if(btn){btn.textContent="↻ Sincronizando API privada…"}
    const r=await fetch(db.config.tnUrl+"/orders?access_token="+db.config.tnToken+"&per_page=100",{headers:{"Accept":"application/json"}});
    if(!r.ok)throw new Error("HTTP "+r.status+" (token inválido?)");
    const arr=await r.json();
    if(!Array.isArray(arr))throw new Error("Respuesta inesperada");
    let added=0,custs=0;
    for(const o of arr){
      const id="tn_"+o.id;
      if(db.orders.every(x=>x.id!==id)){
        const cust=o.customer||{};
        let c=null;
        if(cust.email){
          // Vinculación por email registrado: si ya existe el cliente, el pedido se asocia a su nombre y apellido.
          c=findByEmail(cust.email);
          if(!c){
            const sn=(cust.first_name||cust.last_name)?{firstName:cust.first_name||"",lastName:cust.last_name||""}:splitName(cust.name||"");
            c={id:uid("c"),firstName:sn.firstName||"Cliente",lastName:sn.lastName||"",name:"",email:emailKey(cust.email),phone:cust.phone||"",source:"Tienda Nube API",joined:new Date().toISOString(),tags:"",note:"Importado desde API privada",segment:"",demo:false};
            c.name=fullName(c);db.customers.push(c);custs++;
          }
        }else{c={id:uid("c"),firstName:"Cliente",lastName:"Tienda Nube",name:"Cliente Tienda Nube",email:"",phone:"",source:"Tienda Nube API",joined:new Date().toISOString(),tags:"",note:"Pedido importado sin email",segment:"",demo:false};db.customers.push(c);custs++}
        const items=(o.products_yours||[]).map(p=>({name:p.name,price:Number((p.product&&p.product.price)||0)/100,qty:p.quantity||1})).filter(i=>i.name&&i.price);
        const total=(o.total&&!isNaN(Number(o.total)))?Number(o.total)/100:items.reduce((a,i)=>a+i.price*i.qty,0);
        db.orders.push({id,number:o.number||id,date:o.created_at||new Date().toISOString(),customerId:c.id,items:items.length?items:o.products&&o.products.length?o.products.map(p=>({name:p.name||"Producto",price:0,qty:p.quantity||1})):[{name:"Pedido de la tienda",price:0,qty:1}],status:(o.status||"pagado")==="paid"?"pagado":(o.status||"pagado"),channel:"Tienda online",demo:false});
        added++;
      }
    }
    save();
    db.syncLog.unshift({ts:Date.now(),ok:true,source:"api-privada",added,updated:custs,message:"Pedidos importados en vivo desde la API privada de la tienda"});
    db.syncLog=db.syncLog.slice(0,60);save();render();toast(added+" pedido(s) reales importados de la tienda. "+custs+" cliente(s) nuevos.","ok");
  }catch(e){
    toast("API privada: "+e.message+". Revisá el token en Ajustes.","err");
    db.syncLog.unshift({ts:Date.now(),ok:false,source:"api-privada",added:0,updated:0,message:"Error API privada: "+e.message});
    db.syncLog=db.syncLog.slice(0,60);save();
  }finally{if(btn)btn.textContent="↻ Sincronizar pedidos API privada"}
}

      <div class="hist-item"><span class="d">${fmtD(o.date)}</span><span class="n">${esc(o.number||o.id)}</span><span class="grow">${o.items.map(i=>esc(i.name)+" ×"+i.qty).join("<br>")}</span><span class="badge ${stB[o.status]||"b-gris"}">${esc(o.status)}</span><b>${fmt(totalOf(o))}</b></div>`).join("");

    <label>Tags</label><input id="cl-tags" value="${esc(c.tags||"")}" placeholder="ej: maestra, mayorista, feria">

function saveCli(id){
  const c=db.customers.find(x=>x.id===id);if(!c)return;
  const first=document.getElementById("cl-first").value.trim(),last=document.getElementById("cl-last").value.trim(),email=emailKey(document.getElementById("cl-email").value);
  if(!first&&!last)return toast("Ingresá nombre y apellido.","err");
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast("El email no es válido.","err");
  const dup=email?findByEmail(email,c.id):null;
  if(dup)return toast("Ese email ya está vinculado a "+fullName(dup)+".","err");
  c.firstName=first;c.lastName=last;c.email=email;c.name=fullName(c);
  c.phone=document.getElementById("cl-phone").value.trim();c.source=document.getElementById("cl-src").value.trim();
  c.tags=document.getElementById("cl-tags").value.trim();c.note=document.getElementById("cl-note").value.trim();
  save();closeModal();render();toast("Cliente actualizado.","ok");
}

function saveCnfg(){
  db.config.syncInterval=Math.max(30,parseInt(document.getElementById("cf-int").value)||60);
  db.config.mode=document.getElementById("cf-mode").value;
  db.config.snapshotUrl=document.getElementById("cf-snap").value.trim();
  save();startTimer();toast("Configuración guardada.","ok");syncNow(true,true).then(()=>render());
}
function saveToken(){
  const t=document.getElementById("cf-tn").value.trim();
  db.config.tnToken=t;save();render();toast(t?"Token guardado. Probá importar pedidos.":"Token borrado.","ok");
}
async function saveAdmin(){
  const u=document.getElementById("cf-user").value.trim();
  const p=document.getElementById("cf-pass").value;
  if(!u)return toast("Usuario requerido","err");
  db.auth.user=u;
  if(p)db.auth.hash=await sha256(p);
  save();document.getElementById("menu-user").textContent="Sesión: "+u;
  toast("Cuenta admin actualizada.","ok");
}
function exportCSV(kind){
  const rows=[];
  const head=s=>rows.push(s);
  const cell=x=>'"'+String(x==null?"":x).replace(/"/g,'""')+'"';
  if(kind==="clientes"){head("id,nombre,apellido,email,telefono,origen,segmento,tags,pedidos,unidades,gasto_total,tematica_preferida,titulo_mas_comprado,ultima_compra,notas");
    db.customers.forEach(c=>{const pr=prefsOf(c);rows.push([c.id,c.firstName||"",c.lastName||"",c.email||"",c.phone||"",c.source||"",seg(c),c.tags||"",pr.orders,pr.units,pr.spent,pr.fav?pr.fav.label+" ("+pr.fav.pct+"%)":"",pr.top[0]?pr.top[0].name:"",pr.last||"",c.note||""].map(cell).join(","))});}
  if(kind==="pedidos"){head("numero,fecha,cliente,email,canal,estado,items,total");
    db.orders.forEach(o=>{const c=custOf(o.customerId);rows.push([o.number,o.date,c?fullName(c):"",c?c.email||"":"",o.channel,o.status,o.items.map(i=>i.name+" x"+i.qty).join("; "),totalOf(o)].map(cell).join(","))});}
  if(kind==="productos"){head("nombre,tematicas,precio_tienda,precio_crm,stock,disponibilidad,sin_stock,estado,slug");
    db.products.forEach(p=>rows.push([p.name,themeLabels(p),p.price,p.crmPrice==null?"":p.crmPrice,p.stock,p.availability,isOut(p)?"Sin Stock":"",p.status,p.slug].map(cell).join(",")));}
  const b=new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="crm_"+kind+"_"+Date.now()+"_"+STORE.split(".")[0]+".csv";a.click();
  toast("CSV de "+kind+" exportado.","ok");
}
function exportJSON(){
  const b=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="crm_backup_"+Date.now()+".json";a.click();toast("Backup JSON descargado.","ok");
}
function importJSON(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{const o=JSON.parse(e.target.result);if(!o.products||!o.orders||!o.customers)throw new Error("formato no válido");db=o;migrateDb(db);save();render();toast("Backup importado correctamente.","ok")}catch(err){toast("Importación fallida: "+err.message,"err")}};
  r.readAsText(f);
}
function clearDemo(){
  if(!confirm("Eliminar todos los pedidos/clientes de demo? (productos sincronizados se mantienen)"))return;
  db.orders=db.orders.filter(o=>!o.demo);
  db.customers=db.customers.filter(c=>!c.demo);
  save();render();toast("Datos demo eliminados.","ok");
}
function resetAll(){
  if(!confirm("Restablecer la CRM completa (borra todo y vuelve a la cuenta admin por defecto)?"))return;
  localStorage.removeItem(LS_KEY);
  location.reload();
}
