<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--fg);font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--fg);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
h1{font-family:Georgia,serif}
.hidden{display:none!important}
#login-view{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2D3E46 0%,#41565f 55%,#80AA8D 120%);padding:20px}
.login-card{background:#fff;width:380px;max-width:100%;border-radius:16px;padding:32px 28px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.login-card .logo{width:64px;height:64px;border-radius:14px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;margin:0 auto 14px}
.login-card h1{font-size:22px;text-align:center;font-weight:700;color:var(--dark)}
.login-card p.sub{text-align:center;color:var(--mut);font-size:13px;margin:6px 0 20px}
.hint-seed{background:var(--light);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--mut);margin-bottom:16px;line-height:1.5}
.hint-seed b{color:var(--dark)}
#login-msg{color:var(--err);font-size:12px;min-height:16px;margin-top:10px;text-align:center}
#login-view button.submit,#modal button.submit{width:100%;background:var(--dark);color:#fff;border:0;border-radius:9px;padding:11px;font-size:14px;font-weight:600;margin-top:8px}
#login-view button.submit:hover,#modal button.submit:hover{background:#22333a}
#app-view{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.menu{background:var(--dark);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.menu .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.menu .brand .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.menu .brand b{font-size:14px;display:block;line-height:1.2}
.menu .brand span{font-size:11px;color:#9fb3af}
.menu button.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#cfdcd8;padding:10px 12px;border-radius:9px;text-align:left;font-size:13.5px}
.menu button.nav:hover{background:rgba(255,255,255,.08)}
.menu button.nav.on{background:var(--accent);color:#12201c;font-weight:600}
.menu .pin{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:12px;font-size:11.5px;color:#9fb3af;line-height:1.6}
.sync-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:20px;padding:4px 10px;margin-top:6px;font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.warn{background:var(--warn)}
.dot.err{background:var(--err)}
.main{padding:26px 30px;max-width:1200px;width:100%;margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.head h2{font-size:21px;font-weight:700;color:var(--dark)}
.head .meta{color:var(--mut);font-size:12px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .t{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:700;color:var(--dark);margin-top:6px}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 320px;gap:18px}
.donut-wrap{display:flex;flex-direction:column;gap:10px;align-items:center}
.donut{width:150px;height:150px;border-radius:50%;position:relative}
.donut:after{content:'';position:absolute;inset:22px;background:#fff;border-radius:50%}
.legend{width:100%;font-size:12px}
.legend div{display:flex;justify-content:space-between;padding:4px 2px;border-bottom:1px dashed var(--line)}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#FAFCFA}
.thumb{width:38px;height:50px;object-fit:cover;border-radius:6px;background:var(--light)}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-verde{background:#E2F3EA;color:#1F7A56}
.b-amarillo{background:#FBF0DC;color:#9A5B0A}
.b-rojo{background:#FBE5E3;color:#B02A24}
.b-gris{background:#EDF0EF;color:#5c6b67}
.b-azul{background:#E3EFF8;color:#2C6B9A}
.b-auto{background:#E9EDFB;color:#3D51B5}
.demo-tag{background:#fff3d6;color:#8a6d1f;border:1px dashed #d9b64e;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:600}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font-size:12.5px;font-weight:600;color:var(--dark);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--dark)}
.btn.pri{background:var(--accent);color:#12201c;border-color:var(--accent)}
.btn.pri:hover{background:#6e9a7c}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.danger{color:#B02A24;border-color:#E8C8C5}
.btn.sm{padding:5px 9px;font-size:11.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{width:auto;min-width:170px}
.toolbar .sp{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.rowc{display:flex;gap:10px;align-items:center}
.grow{flex:1}
.mut{color:var(--mut)}.xs{font-size:11.5px}.sm{font-size:12.5px}
#toast-wrap{position:fixed;bottom:18px;right:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--dark);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:340px}
.toast.ok{background:#245c44}.toast.err{background:#8c3a34}
#modal-bg{position:fixed;inset:0;background:rgba(20,30,33,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:18px}
#modal{background:#fff;border-radius:14px;width:520px;max-width:100%;max-height:90vh;overflow:auto;padding:24px}
#modal h3{margin-bottom:16px;color:var(--dark)}
#modal label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
#modal .act{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.log-item{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.log-item .t{color:var(--mut);min-width:118px}
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:10px}
.chart-bars .bar{flex:1;background:linear-gradient(180deg,var(--accent),#5b8370);border-radius:5px 5px 0 0;min-width:14px;position:relative}
.chart-bars .bar span{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--mut);margin-bottom:3px}
.chart-bars .xlab{position:relative;color:var(--mut);font-size:10.5px;text-align:center;padding-top:5px}
@media(max-width:860px){
  #app-view{grid-template-columns:1fr}
  .menu{flex-direction:row;flex-wrap:wrap;height:auto;position:static;gap:6px}
  .menu .brand{padding-bottom:4px}
  .menu .pin{margin-top:0;border:0;padding:4px 8px}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>

async function fetchCatalogRaw(){
  const mode=db.config.mode||"auto";
  const list=PROXIES.map((p,i)=>({p,i}));
  let lastErr=null;
  for(const {p} of list){
    if(mode==="directo"&&p.name!=="directo")continue;
    if(mode==="proxy"&&p.name==="directo")continue;
    try{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),25000);
      const r=await fetch(p.build(CATALOG_URL),{signal:ctrl.signal});
      clearTimeout(t);
      const ct=(r.headers.get("content-type")||"").toLowerCase();
      if(r.ok){const text=await r.text();if(text&&text.includes("structured-data.item"))return{html:text,proxy:p.name,ok:true}}
      else throw new Error("HTTP "+r.status);
    }catch(e){lastErr=e;try{const r2=await fetch(p.build(CATALOG_URL));if(r2.ok){const t2=await r2.text();if(t2.includes("structured-data.item"))return{html:t2,proxy:p.name,ok:true}}}catch(e2){}}
  }
  throw lastErr||new Error("Sin acceso al catálogo público");
}

function parseCatalog(html){
  const out=[];
  const blocks=html.match(/structured-data\.item[\s\S]*?<\/script>/g)||[];
  for(const b of blocks){
    const start=b.indexOf("{");
    if(start<0)continue;
    try{
      const j=JSON.parse(b.slice(start).replace(/<\/script>$/,""));
      if(!j||j["@type"]!=="Product"||!j.offers||!j.name)continue;
      const id=(j.mainEntityOfPage&&j.mainEntityOfPage["@id"])||"";
      const m=id.match(/productos\/([a-z0-9\-]+)\//);
      const inv=j.offers.inventoryLevel?j.offers.inventoryLevel.value:null;
      out.push({slug:m?m[1]:"p_"+Math.random().toString(36).slice(2,7),name:j.name,price:parseFloat(j.offers.price),currency:j.offers.priceCurrency||"ARS",stock:inv!=null?parseInt(inv):null,availability:(j.offers.availability||"").split("/").pop()==="OutOfStock"?"OutOfStock":"InStock",image:j.image||"",description:(j.description||"").slice(0,400)});
    }catch(e){}
  }
  return out;
}

async function syncNow(manual,quiet){
  if(busy)return;busy=true;
  setPill("warn","Sincronizando…");
  const ts=Date.now();
  try{
    const res=await fetchCatalogRaw();
    const items=parseCatalog(res.html);
    if(!items.length)throw new Error("No se encontraron productos en "+CATALOG_URL);
    let added=0,updated=0;
    const bySlug={};
    db.products.forEach(p=>bySlug[p.slug]=p);
    for(const it of items){
      const ex=bySlug[it.slug];
      if(ex){
        ex.price=it.price;ex.stock=it.stock;ex.availability=it.availability;
        ex.image=it.image||ex.image;ex.description=it.description||ex.description;ex.currency=it.currency;
        bySlug[it.slug].fresh=true;updated++;
      }else{
        db.products.push({id:"p_"+it.slug,slug:it.slug,name:it.name,price:it.price,stock:it.stock,availability:it.availability,image:it.image,description:it.description,currency:it.currency,crmPrice:null,status:"activo",category:"Importado en vivo",note:""});
        added++;
      }
    }
    db.lastSync=ts;
    db.lastSource=res.proxy;
    db.syncLog.unshift({ts,ok:true,source:res.proxy,added,updated,message:"Sincronización en tiempo real con el catálogo público ("+CATALOG_URL+")"});
    db.syncLog=db.syncLog.slice(0,60);
    save();
    setPill("on","En línea · "+res.proxy);
    if(!quiet)toast("Sincronizado: "+added+" producto(s) nuevo(s), "+updated+" actualizado(s). "+items.length+" catálogo en vivo.","ok");
    if(manual)render();
  }catch(e){
    db.lastSync=db.lastSync;db.lastSource="caché";
    db.syncLog.unshift({ts,ok:false,source:db.lastSource||"cache",added:0,updated:0,message:"Falla de conexión: "+(e.message||"desconocido")+" · se trabaja con caché local + snapshot"});
    db.syncLog=db.syncLog.slice(0,60);save();
    setPill("err","Caché local");
    if(!quiet)toast("No se pudo conectar ahora ("+(e.message||"")+"). Operando con datos cacheados.","err");
  }finally{
    busy=false;paintLastSync();
  }
}

function seg(c){

  if(spent>=90000)return "VIP";if(n>=2)return "Frecuente";if(n>=1)return "Activo";return "Nuevo";

function channelColors(){
  const ch={};
  db.orders.forEach(o=>{if(o.status!=="cancelado")ch[o.channel]=(ch[o.channel]||0)+totalOf(o)});
  const cols=["#80AA8D","#2D3E46","#71b5dc","#dc8f38","#dd7774"];
  return Object.entries(ch).map(([k,v],i)=>({k,v,c:cols[i%cols.length]}));
}
function weekSeries(){
  const w=[...Array(8)].map((_,i)=>({label:"S"+(-7+i),sum:0}));
  const names={"S-7":"hace 7 sem",0:"esta sem"};
  const base=new Date();base.setHours(0,0,0,0);
  db.orders.forEach(o=>{
    if(o.status==="cancelado")return;
    const d=new Date(o.date);
    const diff=Math.floor((base.getTime()-d.getTime())/6048e5);
    if(diff<0||diff>7)return;
    const idx=7-diff;
    w[idx].sum+=totalOf(o);w[idx].label=diff===0?"esta sem":"S-"+diff;
  });
  return w;
}

    <div class="rowc"><select id="no-prod" class="grow">${prods}</select><input id="no-qty" type="number" value="1" min="1" style="width:80px"></div>
    <label>Canal</label><select id="no-ch"><option>Tienda online</option><option>Instagram</option><option>Feria</option><option>WhatsApp</option><option>Recomendación</option></select>
    <label>Estado</label><select id="no-st"><option>pendiente</option><option>pagado</option><option>enviado</option><option>entregado</option></select>

function saveOrder(){
  const pid=document.getElementById("no-prod").value;
  const p=db.products.find(x=>x.id===pid);
  const n=Math.max(1,parseInt(document.getElementById("no-qty").value)||1);
  const num=1000+Math.floor(Math.random()*9000);
  db.orders.push({id:uid("o"),number:"AP-"+num,date:new Date().toISOString(),customerId:document.getElementById("no-cust").value,items:[{name:p.name,price:prodPriceBuy(p),qty:n}],status:document.getElementById("no-st").value,channel:document.getElementById("no-ch").value,demo:false});
  save();closeModal();render();toast("Pedido AP-"+num+" guardado en la CRM.","ok");
}

async function syncOrders(){
  const btn=document.getElementById("tn-sync-btn");
  try{
    if(btn){btn.textContent="↻ Sincronizando API privada…"}
    const r=await fetch(db.config.tnUrl+"/orders?access_token="+db.config.tnToken+"&per_page=100",{headers:{"Accept":"application/json"}});
    if(!r.ok)throw new Error("HTTP "+r.status+" (token inválido?)");
    const arr=await r.json();
    if(!Array.isArray(arr))throw new Error("Respuesta inesperada");
    let added=0,custs=0;
    for(const o of arr){
      const id="tn_"+o.id;
      if(db.orders.every(x=>x.id!==id)){
        const cust=o.customer||{};
        let c=null;
        if(cust.email){
          c=db.customers.find(x=>x.email===cust.email);
          if(!c){c={id:uid("c"),name:((cust.name||cust.first_name+" "+(cust.last_name||"")).trim())||"Cliente Tienda Nube",email:cust.email,phone:cust.phone||"",source:"Tienda Nube API",joined:new Date().toISOString(),tags:"",note:"Importado desde API privada",segment:"",demo:false};db.customers.push(c);custs++}
        }else c={id:uid("c"),name:"Cliente Tienda Nube",email:"",phone:"",source:"Tienda Nube API",joined:new Date().toISOString(),tags:"",note:"",segment:"",demo:false};
        const items=(o.products_yours||[]).map(p=>({name:p.name,price:Number((p.product&&p.product.price)||0)/100,qty:p.quantity||1})).filter(i=>i.name&&i.price);
        const total=(o.total&&!isNaN(Number(o.total)))?Number(o.total)/100:items.reduce((a,i)=>a+i.price*i.qty,0);
        db.orders.push({id,number:o.number||id,date:o.created_at||new Date().toISOString(),customerId:c.id,items:items.length?items:o.products&&o.products.length?o.products.map(p=>({name:p.name||"Producto",price:0,qty:p.quantity||1})):[{name:"Pedido de la tienda",price:0,qty:1}],status:(o.status||"pagado")==="paid"?"pagado":(o.status||"pagado"),channel:"Tienda online",demo:false});
        added++;
      }
    }
    save();
    db.syncLog.unshift({ts:Date.now(),ok:true,source:"api-privada",added,updated:custs,message:"Pedidos importados en vivo desde la API privada de la tienda"});
    db.syncLog=db.syncLog.slice(0,60);save();render();toast(added+" pedido(s) reales importados de la tienda. "+custs+" cliente(s) nuevos.","ok");
  }catch(e){
    toast("API privada: "+e.message+". Revisá el token en Ajustes.","err");
    db.syncLog.unshift({ts:Date.now(),ok:false,source:"api-privada",added:0,updated:0,message:"Error API privada: "+e.message});
    db.syncLog=db.syncLog.slice(0,60);save();
  }finally{if(btn)btn.textContent="↻ Sincronizar pedidos API privada"}
}

function cliHTML(){
  const q=document.getElementById("cq")?document.getElementById("cq").value:"";
  let list=db.customers.map(c=>({c,seg:seg(c),spent:db.orders.filter(o=>o.customerId===c.id&&o.status!=="cancelado").reduce((a,o)=>a+totalOf(o),0),n:db.orders.filter(o=>o.customerId===c.id).length}));
  if(q)list=list.filter(x=>(x.c.name+" "+(x.c.email||"")).toLowerCase().includes(q.toLowerCase()));
  const rows=list.sort((a,b)=>b.spent-a.spent).map(x=>`
    <tr>
      <td><b>${esc(x.c.name)}</b><div class="xs mut">${esc(x.c.email||"sin email")}</div></td>
      <td>${esc(x.c.source||"")}</td>
      <td>${x.n}</td>
      <td>${fmt(x.spent)}</td>

      <td><button class="btn sm" onclick="editCli('${x.c.id}')">Nota</button></td>
    </tr>`).join("");
  return `
  <div class="head"><div><h2>Clientes</h2><div class="meta">${db.customers.length} contactos · segmentación automática por gasto y pedidos</div></div>
  <div class="rowc"><button class="btn pri" onclick="addLeadModal()">+ Agregar lead</button><button class="btn sm" onclick="go('set')">Exportar</button></div></div>
  <div class="card">
    <div class="toolbar"><input id="cq" placeholder="Buscar cliente..." value="${esc(q)}" oninput="cliUpd()"></div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Cliente</th><th>Origen</th><th>Pedidos</th><th>Gasto</th><th>Segmento</th><th>Tags</th><th></th></tr></thead>
      <tbody>${rows||"<tr><td colspan=7 class='mut'>Sin clientes</td></tr>"}</tbody>
    </table></div>
  </div>`;
}

      </select>
      <div class="act" style="justify-content:flex-start">
        <button class="btn dark" onclick="saveCnfg()">Guardar configuración</button>
        <button class="btn pri" onclick="syncNow(true,true).then(()=>render())" ${busy?"disabled":""}>Sincronizar ahora</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:12px;color:var(--dark)">🔑 API privada Tienda Nube (pedidos/clientes reales)</h3>
      <div class="xs mut" style="margin-bottom:12px">Para leer la base privada (pedidos y clientes de la tienda), creá una app en <b>developers.tiendanube.com</b>, copiá tu <i>access_token</i> y pegálo aquí. Sin token, la CRM usa el catálogo público + datos de demostración.</div>

function saveCnfg(){
  db.config.syncInterval=Math.max(30,parseInt(document.getElementById("cf-int").value)||60);
  db.config.mode=document.getElementById("cf-mode").value;
  save();startTimer();syncNow(true,true).then(()=>render()).catch(()=>render());toast("Configuración guardada.","ok");
}
function saveToken(){
  const t=document.getElementById("cf-tn").value.trim();
  db.config.tnToken=t;save();render();toast(t?"Token guardado. Probá importar pedidos.":"Token borrado.","ok");
}
async function saveAdmin(){
  const u=document.getElementById("cf-user").value.trim();
  const p=document.getElementById("cf-pass").value;
  if(!u)return toast("Usuario requerido","err");
  db.auth.user=u;
  if(p)db.auth.hash=await sha256(p);
  save();document.getElementById("menu-user").textContent="Sesión: "+u;
  toast("Cuenta admin actualizada.","ok");
}
function exportCSV(kind){
  const rows=[];
  const head=s=>rows.push(s);
  if(kind==="clientes"){head("id,nombre,email,telefono,origen,segmento,tags,pedidos,gasto_total,notas");
    db.customers.forEach(c=>rows.push([c.id,c.name,c.email,c.phone,c.source,seg(c),(c.tags||"").replace(/"/g,"'"),db.orders.filter(o=>o.customerId===c.id).length,c.spent||db.orders.filter(o=>o.customerId===c.id&&o.status!=="cancelado").reduce((a,o)=>a+totalOf(o),0),(c.note||"").replace(/"/g,"'")].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")));}
  if(kind==="pedidos"){head("numero,fecha,cliente,canal,estado,items,total");
    db.orders.forEach(o=>{const c=custOf(o.customerId);rows.push([o.number,o.date,c?c.name:"",o.channel,o.status,o.items.map(i=>i.name+" x"+i.qty).join("; "),totalOf(o)].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(","))});}
  if(kind==="productos"){head("nombre,precio_tienda,precio_crm,stock,disponible_sesam,estado,slug");
    db.products.forEach(p=>rows.push([p.name,p.price,p.crmPrice||"",p.stock,p.availability,p.status,p.slug].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")));}
  const b=new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="crm_"+kind+"_"+Date.now()+"_"+STORE.split(".")[0]+".csv";a.click();
  toast("CSV de "+kind+" exportado.","ok");
}
function exportJSON(){
  const b=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="crm_backup_"+Date.now()+".json";a.click();toast("Backup JSON descargado.","ok");
}
function importJSON(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{const o=JSON.parse(e.target.result);if(!o.products||!o.orders||!o.customers)throw new Error("formato no válido");db=o;save();render();toast("Backup importado correctamente.","ok")}catch(err){toast("Importación fallida: "+err.message,"err")}};
  r.readAsText(f);
}
function clearDemo(){
  if(!confirm("Eliminar todos los pedidos/clientes de demo? (productos sincronizados se mantienen)"))return;
  db.orders=db.orders.filter(o=>!o.demo);
  db.customers=db.customers.filter(c=>!c.demo);
  save();render();toast("Datos demo eliminados.","ok");
}
function resetAll(){
  if(!confirm("Restablecer la CRM completa (borra todo y vuelve a la cuenta admin por defecto)?"))return;
  localStorage.removeItem(LS_KEY);
  location.reload();
}
